# Wordt pas actief via deploy/enable-public.sh, nadat DNS voor mcp.holos33.com naar deze VPS wijst.
limit_req_zone $binary_remote_addr zone=holos33_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=holos33_conn:10m;

server {
    listen 80;
    server_name mcp.holos33.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 op deze host: http2 als listen-parameter, niet als losse directive.
    listen 443 ssl http2;
    server_name mcp.holos33.com;
    server_tokens off;
    client_max_body_size 64k;

    ssl_certificate /etc/letsencrypt/live/mcp.holos33.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.holos33.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /mcp {
        limit_req zone=holos33_ip burst=20 nodelay;
        limit_req_status 429;
        limit_conn holos33_conn 10;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8324;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For "";
    }

    location = /healthz {
        limit_req zone=holos33_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8324;
        proxy_set_header Host $host;
    }

    # Beide Server Card-paden, ai-catalog, llms.txt, llms-full.txt en /md/...; de app geeft 404 voor de rest.
    location / {
        limit_req zone=holos33_ip burst=20 nodelay;
        limit_req_status 429;
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8324;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
    }
}
